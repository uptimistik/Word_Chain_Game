<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport"
		content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
	<link rel="icon" href="data:,">
	<title>Word Chain</title>
	<link rel="stylesheet" type="text/css" href="css/gse-style.css" />
	<link rel="stylesheet" type="text/css" href="css/gse-style-loading.css" />
	<style type="text/css">
		body {
			background-color: black;
			margin: 0;
			padding: 0;
			overflow: hidden;
			touch-action: none;
			-webkit-touch-callout: none;
			-webkit-user-select: none;
			user-select: none;
		}
	</style>
</head>

<body>
	<div id="gse-player" class="gse-frame">
		<!-- The engine will create and insert drawing elements here. -->
		<div class="gse-overlay">
			<div id="gse-text" class="gse-dialog">
				<div>
					<button id="gse-text-cancel">Cancel</button>
					<button id="gse-text-done">Done</button>
					<p id="gse-text-prompt"></p>
				</div>
				<div>
					<textarea id="gse-text-input"></textarea>
				</div>
			</div>
			<div id="gse-browser" class="gse-dialog">
				<iframe id="gse-browser-frame"></iframe>
				<button id="gse-browser-close" href="#">&#10006;</button>
			</div>
			<div id="gse-loading" style="visibility: visible;">
				<img src="images/gse-loading.png" />
			</div>
		</div>
	</div>

	<script type="text/javascript">
		(function (global) {
			global.onEngineLoad = function () {
				gse.ready(function (engine) {
					var loadingElement = document.getElementById('gse-loading');
					var playerDelegate = {
						onLoadingBegin: function () {
							engine.showOverlay();
							if (loadingElement) loadingElement.style.visibility = 'visible';
						},

						onLoadingEnd: function () {
							if (loadingElement) loadingElement.style.visibility = 'hidden';
							engine.hideOverlay();
						},

						onWindowResize: function () {
							engine.relayout();
						}
					};
					engine.appendDelegate(playerDelegate);
					window.addEventListener('resize', playerDelegate.onWindowResize, false);

					// Viewport settings: letterbox ensures the tray and all UI buttons fit perfectly on all screens
					engine.setRenderFrame('gse-player');
					engine.setOptions({
						'viewport-reference': 'window',
						'viewport-fit': 'overscan'
					});
					engine.loadOptionsFromURL();

					// 1) Haptics: tile collision bumps & lower vibration for fake tile soundfx
					if (window.WordChainHaptics) {
						WordChainHaptics.install();
					}

					// 2) Multitouch: 2-finger MAX multi-touch with instant grab & throw velocity physics
					if (window.WordChainMultitouch) {
						WordChainMultitouch.install();
					}

					// 3) Shadow Shader: Soft GLSL FBO drop shadow on desired layers
					if (window.WordChainShadowShader) {
						WordChainShadowShader.install();
					}

					// Start the game
					engine.play();
				});
			};
		}(window));
	</script>
	<script type="text/javascript" src="js/haptics-bridge.js?v=20261027_4"></script>
	<script type="text/javascript" src="js/multitouch-bridge.js?v=20261028_3"></script>
	<script type="text/javascript" src="js/shadow-shader-bridge.js?v=20261028_4"></script>
	<script type="text/javascript" src="js/gse/gse-export.js" onload="onEngineLoad()"></script>
</body>

</html>
