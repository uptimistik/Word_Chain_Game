plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wordchaingame.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.wordchaingame.app"
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

